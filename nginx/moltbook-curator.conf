# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=write_limit:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name moltbook-curator.online www.moltbook-curator.online;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name moltbook-curator.online www.moltbook-curator.online;

    ssl_certificate /etc/letsencrypt/live/moltbook-curator.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moltbook-curator.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Connection limits (per IP)
    limit_conn conn_limit 50;

    # Serve skill.md directly
    location = /skill.md {
        alias /var/www/moltbook-curator/skill.md;
        default_type text/markdown;
    }

    # Write endpoints (POST) - 50 req/s per IP
    location ~ ^/api/(suggest|vote) {
        limit_req zone=write_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Read endpoints - 100 req/s per IP
    location /api/ {
        limit_req zone=api_limit burst=200 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
