name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /var/www/moltbook-curator || exit 1

            # Pull latest code
            git pull origin main

            # Install dependencies
            npm ci --production=false

            # Build
            npm run build

            # Make scripts executable
            chmod +x scripts/*.sh

            # Setup cron for 4-hour reset cycle (if not already set)
            (crontab -l 2>/dev/null | grep -v 'reset-cycle') | crontab -
            (crontab -l 2>/dev/null; echo '0 0,4,8,12,16,20 * * * /var/www/moltbook-curator/scripts/reset-cycle.sh') | crontab -

            # Restart app with PM2
            pm2 restart moltbook-curator || pm2 start dist/main.js --name moltbook-curator

            echo "Deployed successfully!"
