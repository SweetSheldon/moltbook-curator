name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /var/www/moltbook-curator || exit 1

            # Pull latest code
            git pull origin main

            # Install dependencies (with native modules rebuild)
            npm ci

            # Build
            npm run build

            # Make scripts executable
            chmod +x scripts/*.sh

            # Update nginx config
            cp nginx/moltbook-curator.conf /etc/nginx/sites-available/moltbook-curator
            nginx -t && systemctl reload nginx

            # Setup cron for 4-hour reset cycle
            (crontab -l 2>/dev/null | grep -v 'reset-cycle') | crontab -
            (crontab -l 2>/dev/null; echo '0 0,4,8,12,16,20 * * * /var/www/moltbook-curator/scripts/reset-cycle.sh') | crontab -

            # Restart app with PM2 (cluster mode, 2 workers)
            pm2 restart moltbook-curator || pm2 start dist/main.js --name moltbook-curator -i 2
            pm2 save

            echo "Deployed successfully!"
